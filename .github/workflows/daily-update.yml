name: Daily Stock Valuation Update & Deploy

on:
  schedule:
    # Twice every trading weekday: 14:00 UTC (US open / EU afternoon) & 21:30 UTC (after US close)
    - cron: '0 14 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send_email:
        description: 'Send immediate test / status email even if no new signal changed'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'public/**'
      - '.github/workflows/daily-update.yml'

permissions:
  contents: write
  issues: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest daily valuations, price ranges, and shock checks
        run: python3 scripts/update_data.py

      - name: Evaluate stock signal transitions & dispatch optional email alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          GITHUB_ISSUE_ALERTS: ${{ vars.GITHUB_ISSUE_ALERTS }}
          FORCE_SEND_EMAIL: ${{ inputs.force_send_email }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/send_alerts.py --no-send
          else
            python3 scripts/send_alerts.py
          fi

      - name: Commit updated stock snapshot to main (on scheduled or manual runs)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json public/data/stocks_snapshot.js public/data/alert_state.json
          git diff --staged --quiet || (git commit -m "chore(data): daily stock valuation & price range update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push origin HEAD:main)

      - name: Publish static site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_DIR=$(mktemp -d)
          cp -R public/. "$DEPLOY_DIR/"
          touch "$DEPLOY_DIR/.nojekyll"
          cd "$DEPLOY_DIR"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: stock-signal $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
